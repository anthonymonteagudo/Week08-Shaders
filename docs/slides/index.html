<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 8 · Materials and shading</title><style>*{box-sizing:border-box}body{font:18px/1.6 Arial;margin:0;background:#edf3f4;color:#123e4d}main,header{max-width:1240px;margin:auto;padding:24px}h1{font-size:42px;line-height:1.15}h2{margin-top:0}a{color:#087c78}nav{display:flex;gap:22px;flex-wrap:wrap}article,section.card{background:white;padding:24px;margin:24px 0;border-top:3px solid #09988e}img{max-width:100%;height:auto}pre,code{font-family:Consolas,monospace;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#edf3f4;padding:15px}table{border-collapse:collapse;width:100%}th,td{padding:12px;border:1px solid #b9ced0;text-align:left}th{background:#0a4054;color:white}input,select,button,textarea{font:inherit;padding:10px;color:inherit}textarea{width:100%;min-height:110px}small{color:#526c75}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.tag{color:#087c78;font-size:14px;text-transform:uppercase}details{margin:15px 0}summary{cursor:pointer}button{cursor:pointer;background:white;border:1px solid #78a4aa}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #e3a635} @media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:32px}}@media print{nav,button{display:none}article{break-inside:avoid}}body{background:#102e3c;color:white}header{max-width:none;padding:10px 24px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}header a{color:#a2e1dc}main{padding:8px 20px;max-width:1400px}#stage{position:relative;aspect-ratio:16/9;background:white}#slide{width:100%;height:100%;object-fit:contain}#motion{position:absolute;object-fit:contain}#demo{width:100%;height:100%;border:0;position:absolute;inset:0;background:#edf3f4}#notes{background:#fff;color:#123e4d;padding:22px}#notes p{white-space:pre-wrap}#caption{margin:8px 0}select{max-width:420px}a[hidden],button[hidden],img[hidden],iframe[hidden]{display:none}header button,header select{color:#123e4d;background:#fff}</style><header><a href="../../index.html">Classroom</a><button id="prev">← Previous</button><button id="next">Next →</button><select id="pick" aria-label="Slide"></select><a id="guest" href="../guest/Rasterization.pdf" target="_blank" rel="noopener" hidden>Ned’s original slides (PDF)</a><button id="live" hidden>Explore live GLSL</button><button id="motionButton" hidden>Pause animation</button><a href="https://github.com/anthonymonteagudo/Week08-Shaders/releases/latest">Download PowerPoint</a></header><main><div id="stage"><img id="slide" alt=""><img id="motion" alt="Animated material result" hidden><iframe id="demo" title="Interactive GLSL shader example" hidden></iframe></div><p id="caption"></p><details id="notes"><summary>Explanation and references</summary><p id="narration"></p><div id="sources"></div></details></main><script type="module">
const data=await(await fetch('slides.json')).json(),$=id=>document.getElementById(id);let index=0,live=false,motion=true;
data.forEach((d,i)=>$('pick').add(new Option(d.number+' · '+d.title+(d.appendix?' [reference]':''),i)));
function show(){index=Math.max(0,Math.min(data.length-1,(+location.hash.slice(1)||1)-1));const d=data[index];$('guest').hidden=![4,5].includes(d.number);$('pick').value=index;$('slide').src=d.preview;$('slide').alt=d.title;$('caption').textContent=d.number+' / '+data.length+' · '+d.section+(d.appendix?' · Optional reference':'');$('narration').textContent=d.notes;$('sources').replaceChildren(...d.sources.map(s=>{const p=document.createElement('p');if(s.startsWith('https://')){const a=document.createElement('a');a.href=s;a.textContent=s;p.append(a);}else p.textContent=s;return p;}));live=false;$('demo').hidden=true;$('demo').removeAttribute('src');$('live').textContent='Explore live GLSL';$('live').hidden=!d.lesson;$('motionButton').hidden=!d.motion;$('motion').hidden=!d.motion||!motion;if(d.motion){$('motion').src=d.motion;const b=d.kind==='demo'?[616,170,592,333]:[152,148,976,432];['left','top','width','height'].forEach((k,i)=>$('motion').style[k]=(b[i]/(i%2?720:1280)*100)+'%');}}
$('prev').onclick=()=>location.hash=Math.max(1,index);$('next').onclick=()=>location.hash=Math.min(data.length,index+2);$('pick').onchange=()=>location.hash=+$('pick').value+1;
$('live').onclick=()=>{live=!live;$('demo').hidden=!live;$('live').textContent=live?'Return to slide':'Explore live GLSL';if(live)$('demo').src='../../index.html?embed=1&lesson='+data[index].lesson;else $('demo').removeAttribute('src');};
$('motionButton').onclick=()=>{motion=!motion;$('motion').hidden=!motion;$('motionButton').textContent=motion?'Pause animation':'Play animation';};
window.addEventListener('hashchange',show);window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();});show();
</script></html>
